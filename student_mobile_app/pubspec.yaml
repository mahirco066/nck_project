name: nkc_results_app
description: "تطبيق استعلام نتائج الطلاب - كلية شمال كردفان (North Kordofan College - Results App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # واجهة وتصميم
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0

  # شبكة وتواصل
  http: ^1.2.0

  # ملفات الـ PDF والطباعة والمشاركة
  flutter_pdfview: ^1.3.2
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  open_filex: ^4.4.0

  # تخزين محلي للبحث السريع
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
